allowBuilds:
  tailwindcss/oxide: true
  core-js: true
  es5-ext: true
  esbuild: true
  node: true
  sharp: true
  unrs-resolver: true

# These plugins still declare ESLint <=9 peer ranges but pass the complete
# lint suite on ESLint 10. Remove the exceptions once upstream widens them.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'

overrides:
  'semver@>=7.0.0 <7.6.3': '>=7.6.3'
  'zod@<=3.24.1': '>=3.24.1'
  'postcss@<8.5.23': '>=8.5.23'
  'rimraf@<6.0.1': '>=6.0.1'
  '@xmldom/xmldom@<0.9.12': '>=0.9.12'
  'follow-redirects@<1.16.1': '>=1.16.1'
  'source-map-js@<1.2.2': '>=1.2.2'
  '@babel/core@>=7.0.0 <8.0.0': '7.29.7'
  'browserslist@>=4.0.0 <5.0.0': '4.29.4'
  'baseline-browser-mapping@<2.11.0': '>=2.11.0'
  'brace-expansion@>=1.0.0 <2.0.0': '1.1.21'
  'brace-expansion@>=5.0.0 <6.0.0': '5.0.12'
  'js-yaml@>=4.0.0 <5.0.0': '4.3.2'
  'zod@<4.6.6': '4.6.7'
  'katex@<0.18.2': '0.19.1'
  'react@<19.0.0': '>=19.0.0'
  'react-dom@<19.0.0': '>=19.0.0'
